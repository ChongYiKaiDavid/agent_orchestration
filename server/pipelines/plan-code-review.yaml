id: plan-code-review
name: Plan - Code - Review
description: Create a plan, implement the code, then review it.
git:
  create_branch: true
  from: "{git.target_branch}"
  pattern: "feature/{task_id}"
  commit_strategy: on_go
stages:
  - id: planning
    name: Planning
    summary: Create a requirements and design plan for the task.
    outputFiles:
      - planner.requirements.md
      - planner.design.md
  - id: coding
    name: Coding
    summary: Generate a code implementation based on the plan.
    outputFiles:
      - implementation.diff.md
  - id: reviewing
    name: Reviewing
    summary: Review the implementation and produce a verdict.
    outputFiles:
      - reviewer.review.md
on_complete:
  - hook: git_push
  - hook: create_pr
    config:
      target_branch: "{git.target_branch}"
      title: "{task_id}: {task_title}"
post_complete_status: pr_review
max_retries: 3