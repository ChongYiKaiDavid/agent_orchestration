id: plan-code-review
name: Plan - Code - Review
description: Create a plan, implement the code, then review it.
git:
  create_branch: true
  from: "{git.target_branch}"
  pattern: "feature/{task_id}"
  commit_strategy: on_go
stages:
  - id: planning
    name: Planning
    agent: deepseek
    summary: Create a requirements and design plan for the task.
    outputFiles:
      - planner.requirements.md
      - planner.design.md
    cli:
      command: deepseek-cli
      args:
        - --prompt
        - "{prompt}"
        - --output
        - "{outputFile}"
      env:
        DEEPSEEK_API_KEY: "{DEEPSEEK_API_KEY}"
        DEEPSEEK_MODEL: deepseek-coder
        DEEPSEEK_BASE_URL: "{DEEPSEEK_BASE_URL}"
        DEEPSEEK_TIMEOUT_MS: "{DEEPSEEK_TIMEOUT_MS}"
  - id: coding
    name: Coding
    agent: devin
    summary: Generate a code implementation based on the plan.
    outputFiles:
      - implementation.diff.md
    cli:
      command: devin
      args:
        - --prompt-file
        - "{promptFile}"
        - --print
      env:
        DEVIN_PERMISSION_MODE: dangerous
        DEVIN_MODEL: claude-3-opus-20240229
  - id: reviewing
    name: Reviewing
    agent: deepseek
    summary: Review the implementation and produce a verdict.
    outputFiles:
      - reviewer.review.md
    cli:
      command: deepseek-cli
      args:
        - --prompt
        - "{prompt}"
        - --output
        - "{outputFile}"
      env:
        DEEPSEEK_API_KEY: "{DEEPSEEK_API_KEY}"
        DEEPSEEK_MODEL: deepseek-coder
        DEEPSEEK_BASE_URL: "{DEEPSEEK_BASE_URL}"
        DEEPSEEK_TIMEOUT_MS: "{DEEPSEEK_TIMEOUT_MS}"
on_complete:
  - hook: git_push
  - hook: create_pr
    config:
      target_branch: "{git.target_branch}"
      title: "{task_id}: {task_title}"
post_complete_status: pr_review
max_retries: 3